version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: loan_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loan_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-loan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /home/tony/docker/loan-tracker/backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - /home/tony/docker/loan-tracker/backend/migrations/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loan_user} -d ${POSTGRES_DB:-loan_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan_internal

  backend:
    build:
      context: /home/tony/docker/loan-tracker/backend
      dockerfile: Dockerfile
    container_name: loan_tracker_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loan_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-loan_tracker}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/home/tony/docker/loan-tracker/backups}
    volumes:
      - uploads_data:/app/uploads
      - /home/tony/docker/loan-tracker/backend:/app
      - /home/tony/docker/loan-tracker/backups:/app/backups
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - loan_internal

  frontend:
    build:
      context: /home/tony/docker/loan-tracker/frontend
      dockerfile: Dockerfile
    container_name: loan_tracker_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      - /home/tony/docker/loan-tracker/frontend/src:/app/src
      - /home/tony/docker/loan-tracker/frontend/index.html:/app/index.html
      - /home/tony/docker/loan-tracker/frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - loan_internal

  nginx:
    image: nginx:1.25-alpine
    container_name: loan_tracker_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - /home/tony/docker/loan-tracker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - loan_internal

  worker:
    build:
      context: /home/tony/docker/loan-tracker/backend
      dockerfile: Dockerfile
    container_name: loan_tracker_worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loan_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-loan_tracker}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - loan_internal

volumes:
  postgres_data:
    name: loan_tracker_postgres_data
  uploads_data:
    name: loan_tracker_uploads

networks:
  loan_internal:
    driver: bridge
    name: loan_tracker_network
