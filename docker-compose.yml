version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: shadow_debt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shadow_debt}
      POSTGRES_USER: ${POSTGRES_USER:-shadow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/migrations/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "127.0.0.1:54316:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadow_user} -d ${POSTGRES_DB:-shadow_debt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadow_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadow_debt_backend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadow_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-shadow_debt}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKUP_DIR: /app/backups
    volumes:
      - ./backend/uploads:/app/uploads
      #- ./backend:/app
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:54317:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shadow_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadow_debt_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      #- ./frontend/src:/app/src
      #- ./frontend/index.html:/app/index.html
      #- ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - shadow_internal

  nginx:
    image: nginx:1.25-alpine
    container_name: shadow_debt_nginx
    restart: unless-stopped
    ports:
      - "54318:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - shadow_internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadow_debt_worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadow_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-shadow_debt}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shadow_internal

volumes:
  postgres_data:
    name: shadow_debt_postgres_data

networks:
  shadow_internal:
    driver: bridge
    name: shadow_debt_network
