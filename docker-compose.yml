version: "3.9"
services:
  db:
    build:
      context: ./backend/migrations
      dockerfile: Dockerfile
    container_name: shadowdebt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shadowdebt}
      POSTGRES_USER: ${POSTGRES_USER:-shadow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54314:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shadow_user} -d ${POSTGRES_DB:-shadowdebt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shadowdebt_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowdebt_backend
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadow_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-shadowdebt}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-INR}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKUP_DIR: /app/backups
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backups:/app/backups
    ports:
      - "127.0.0.1:54315:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shadowdebt_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shadowdebt_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    networks:
      - shadowdebt_internal

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: shadowdebt_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:54316:80"
    depends_on:
      - frontend
      - backend
    networks:
      - shadowdebt_internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shadowdebt_worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      TZ: Asia/Kolkata
      DATABASE_URL: postgresql://${POSTGRES_USER:-shadow_user}:${POSTGRES_PASSWORD:-changeme_strong_password}@db:5432/${POSTGRES_DB:-shadowdebt}
      ALERT_LEAD_DAYS: ${ALERT_LEAD_DAYS:-7}
      SECRET_KEY: ${SECRET_KEY:-changeme_secret_key_min_32_chars}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shadowdebt_internal

volumes:
  postgres_data:
    name: shadowdebt_postgres_data

networks:
  shadowdebt_internal:
    driver: bridge
    name: shadowdebt_network
