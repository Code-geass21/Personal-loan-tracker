events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # File upload limit (must match MAX_UPLOAD_MB in .env)
    client_max_body_size 25M;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name localhost;

        # ── API — proxied to FastAPI backend ──
        location /api/ {
            proxy_pass         http://shadowdebt_backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Health check passthrough ──
        location /health {
            proxy_pass http://shadowdebt_backend:8000/health;
        }

        # ── Static file uploads (served directly) ──
        location /uploads/ {
            proxy_pass http://shadowdebt_backend:8000/uploads/;
        }

        # ── Frontend — all other routes ──
        location / {
            proxy_pass         http://shadowdebt_frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
